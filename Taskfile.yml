version: '3'

tasks:
  serve:
    desc: Serve the static app on :8799
    cmds: [python3 -m http.server 8799]

  dev:
    desc: Run the API Worker locally on :8787 (local D1, no login needed)
    dir: api
    cmds: [npx wrangler dev]

  install:
    desc: Install the API's dependencies (npm needs legacy peer deps here, see QUIRKS)
    dir: api
    cmds: [npm install --legacy-peer-deps]

  db:migrate:
    desc: Apply D1 migrations to the local database (task dev needs this once)
    dir: api
    cmds: [npx wrangler d1 migrations apply tablework --local]

  db:seed-clips:
    desc: Put the show's rendered clips into the local clip cache (quote = $0 for them)
    dir: api
    cmds:
      - node scripts/seed-clips.mjs > ../tmp/seed-clips.sql
      - npx wrangler d1 execute tablework --local --file ../tmp/seed-clips.sql

  test:
    desc: The gate — API unit tests, typecheck, and a syntax pass over index.html
    cmds:
      - cd api && npx vitest run
      - cd api && npx tsc --noEmit
      - node -e "const h=require('fs').readFileSync('index.html','utf8');for(const b of h.match(/<script>([\s\S]*?)<\/script>/g)){try{new Function(b.replace(/<\/?script>/g,''))}catch(e){if(!/window|document|localStorage|await/.test(e.message)){console.error('index.html:',e.message);process.exit(1)}}}console.log('index.html syntax ok')"

  demo:shots:
    desc: Seed a synthetic production on the local API and screenshot the app at phone width for the /demo walkthrough (tmp/demo/)
    cmds:
      - mkdir -p tmp
      - cd api && (nohup npx wrangler dev --port 8787 > ../tmp/wrangler-dev.log 2>&1 </dev/null &)
      - (nohup python3 -m http.server 8799 > tmp/http.log 2>&1 </dev/null &)
      - sleep 8
      - node api/scripts/demo-shots.mjs
      - pkill -f "wrangler dev --port 8787" || true
      - pkill -f "http.server 8799" || true

  deploy:
    desc: Deploy the API Worker to production (Lee only — needs `wrangler login`; see docs/ARCHITECTURE.md)
    dir: api
    cmds:
      - npx wrangler d1 migrations apply tablework --env production --remote
      - npx wrangler deploy --env production

  deploy:check:
    desc: Dry-run the production deploy (no login needed)
    dir: api
    cmds: [npx wrangler deploy --dry-run --env production]
