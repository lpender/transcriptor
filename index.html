<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Follower</title>
<style>
  :root { --bg: #111; --fg: #eee; --dim: #555; --hi: #ffd84d; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 32px/1.5 Georgia, serif; }
  #edit { max-width: 800px; margin: 40px auto; padding: 0 16px; font-size: 16px; }
  textarea { width: 100%; height: 60vh; font: 16px/1.4 monospace; background: #222; color: var(--fg); border: 1px solid #444; padding: 8px; box-sizing: border-box; }
  button { font-size: 16px; padding: 8px 16px; margin-top: 8px; }
  #read { max-width: 900px; margin: 0 auto; padding: 50vh 16px; }
  #read p { margin: 0 0 .6em; color: var(--dim); transition: color .2s; cursor: pointer; }
  #read p.cur { color: var(--hi); }
  #read p.cur ~ p { color: var(--fg); }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 8px 16px; background: #000c; font: 16px/1.4 system-ui, sans-serif; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  #hud select { font-size: 16px; }
  #hint { color: #999; }
  body.learn #read p.mine:not(.shown) { filter: blur(10px); }
  #read p.got { box-shadow: -8px 0 0 #3c6; }
  #read p.missed { box-shadow: -8px 0 0 #e44; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="edit">
  <p>Paste script. One line per step. Then Start. Keys: Space/↓ next, ↑/Backspace back, Esc edit, L learn mode. Click a line to jump.</p>
  <textarea id="src"></textarea>
  <button id="start">Start</button>
</div>
<div id="hud" hidden>
  <label>Your role <select id="role" onchange="this.blur(); startLearn()"></select></label>
  <b id="score"></b>
  <span id="hint"></span>
</div>
<div id="read" hidden></div>
<script src="script.js"></script>
<script>
const src = document.getElementById('src'), read = document.getElementById('read'), edit = document.getElementById('edit');
const hud = document.getElementById('hud'), role = document.getElementById('role'), score = document.getElementById('score'), hint = document.getElementById('hint');
let lines = [], i = 0;
// Learn mode: your role's lines are blurred. Recall, reveal, grade yourself.
let learn = false, drill = null, got = 0, tried = 0, streak = 0;
const speaker = p => p.textContent.split(':')[0];
const load = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
try { src.value = localStorage.getItem('script') || window.SCRIPT || ''; } catch {}

function show(n) {
  i = Math.max(0, Math.min(lines.length - 1, n));
  lines.forEach((p, k) => p.classList.toggle('cur', k === i));
  lines[i]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (learn) render();
}

const cur = () => lines[i];
const waiting = () => learn && cur().classList.contains('mine') && !cur().classList.contains('got') && !cur().classList.contains('missed');

function render() {
  const best = +load('best:' + role.value, 0);
  score.textContent = `${got}/${tried} · streak ${streak} · best ${best}` + (drill ? ` · drilling ${drill.length} missed` : '');
  const left = lines.filter(p => p.classList.contains('mine') && !p.classList.contains('got') && !p.classList.contains('missed')).length;
  if (waiting()) hint.textContent = cur().classList.contains('shown') ? 'Y / → got it · N missed' : 'Say your line, then Space to reveal';
  else if (!left) {
    const missed = lines.filter(p => p.classList.contains('missed')).length;
    hint.textContent = missed ? `Done! R to drill ${missed} missed` : 'Perfect run! R to go again';
  } else hint.textContent = 'Space next · L exit learn mode';
}

function startLearn(only) {
  learn = true; got = tried = streak = 0;
  drill = only?.length ? only : null;
  document.body.classList.add('learn'); hud.hidden = false;
  lines.forEach(p => {
    p.classList.toggle('mine', speaker(p) === role.value && (!drill || drill.includes(p)));
    p.classList.remove('shown', 'got', 'missed');
  });
  save('role', role.value);
  step(-1);
}

// Next line; while drilling, jump to the cue line before the next missed line.
function step(from) {
  if (!drill) return show(from + 1);
  const t = lines.findIndex((p, k) => k > from && p.classList.contains('mine') && !p.classList.contains('got') && !p.classList.contains('missed'));
  show(t < 0 ? lines.length - 1 : from < t - 1 ? t - 1 : t);
}

function grade(ok) {
  cur().classList.add(ok ? 'got' : 'missed');
  tried++;
  if (ok) { got++; streak++; if (streak > +load('best:' + role.value, 0)) save('best:' + role.value, streak); }
  else streak = 0;
  step(i);
}

document.getElementById('start').onclick = () => {
  try { localStorage.setItem('script', src.value); } catch {}
  read.replaceChildren(...src.value.split('\n').filter(l => l.trim()).map((t, k) => {
    const p = document.createElement('p');
    p.textContent = t;
    p.onclick = () => show(k);
    return p;
  }));
  lines = [...read.children];
  if (!lines.length) return;
  const counts = {};
  lines.forEach(p => counts[speaker(p)] = (counts[speaker(p)] || 0) + 1);
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  role.replaceChildren(...names.map(n => new Option(n)));
  role.value = names.includes(load('role')) ? load('role') : names[0];
  learn = false; document.body.classList.remove('learn'); hud.hidden = true;
  edit.hidden = true; read.hidden = false;
  show(0);
};

if (src.value.trim()) document.getElementById('start').click();

document.addEventListener('keydown', e => {
  if (read.hidden || e.target === role) return;
  const k = e.key.toLowerCase();
  if (waiting() && !cur().classList.contains('shown') && (k === ' ' || k === 'arrowdown')) { cur().classList.add('shown'); render(); }
  else if (waiting() && (k === 'y' || k === 'arrowright' || k === ' ')) grade(true);
  else if (waiting() && k === 'n') grade(false);
  else if (k === 'l') learn ? (learn = false, drill = null, document.body.classList.remove('learn'), hud.hidden = true, lines.forEach(p => p.classList.remove('mine', 'shown', 'got', 'missed'))) : startLearn();
  else if (learn && k === 'r' && !waiting()) startLearn(lines.filter(p => p.classList.contains('missed')));
  else if (k === ' ' || k === 'arrowdown') step(i);
  else if (k === 'arrowup' || k === 'backspace') show(i - 1);
  else if (k === 'escape') { read.hidden = true; edit.hidden = false; }
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
