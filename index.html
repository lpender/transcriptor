<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Script Follower</title>
<style>
  /* A prompter's script: manila paper, typewriter ribbon, read in a dark room. */
  :root {
    --ink: #13120E;        /* backstage dark, warm not blue */
    --surface: #1E1C16;
    --edge: #322E24;
    --paper: #EFE7D6;      /* typing paper */
    --faded: #8C8371;      /* carbon copy, lines already past */
    --ribbon: #C8462F;     /* typewriter ribbon red */
    --stamp: #8FA05A;      /* approved */
    --cue: #B9AE94;        /* character cues */
    --tap: 52px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font: 400 clamp(19px, 4.6vw, 27px)/1.6 Georgia, 'Iowan Old Style', serif;
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ribbon); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- the script ---- */
  #read { max-width: 34em; margin: 0 auto; padding: 45vh 20px calc(50vh + var(--tap)); }
  #read p {
    margin: 0 0 .85em; color: var(--faded); cursor: pointer;
    transition: color .25s ease; padding-left: 14px; border-left: 2px solid transparent;
  }
  #read p.cur { color: var(--paper); border-left-color: var(--ribbon); }
  #read p.cur ~ p { color: #5C5648; }
  #read b { font-weight: 700; color: #FFF8E8; }
  #read .hide { color: #3A362C; letter-spacing: .12em; }
  #read .now { color: #FFF3DC; }
  #read .weak { text-decoration: underline wavy var(--ribbon); text-underline-offset: 7px; text-decoration-thickness: 1px; }
  #read hr { border: 0; border-top: 1px solid var(--edge); margin: 2em 30%; }
  body.learn #read p.cur ~ p, body.learn #read p.cur ~ hr { visibility: hidden; }

  /* ---- top strip: only what is true right now ---- */
  #hud {
    position: fixed; inset: 0 0 auto; z-index: 2;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background: linear-gradient(var(--ink) 72%, transparent);
    font: 500 14px/1.45 ui-monospace, 'SF Mono', Menlo, monospace;
    display: flex; gap: 14px; align-items: baseline;
  }
  #score { color: var(--cue); letter-spacing: .04em; white-space: nowrap; }
  #hint { color: var(--faded); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- the bar you keep your thumb on ---- */
  #bar {
    position: fixed; inset: auto 0 0; z-index: 3; display: flex; gap: 10px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--ink) 34%);
    max-width: 44em; margin: 0 auto;
  }
  #bar button {
    min-height: var(--tap); border: 1px solid var(--edge); border-radius: 12px;
    background: var(--surface); color: var(--paper);
    font: 500 15px/1 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .02em;
  }
  #bar #mainBtn { flex: 1; font-size: 17px; border-color: #4A4335; background: #262218; }
  #bar #backBtn { width: var(--tap); font-size: 19px; }
  #bar #menuBtn { width: 68px; }
  #bar #missBtn { width: 76px; border-color: #5A2C21; color: #E8917C; }
  #bar button:disabled { opacity: .3; }

  /* ---- the rest lives here ---- */
  #sheet {
    border: 0; padding: 0; margin: auto auto 0; width: min(100%, 34em);
    background: var(--surface); color: var(--paper);
    border-radius: 16px 16px 0 0; border-top: 1px solid var(--edge);
    animation: rise .18s ease-out;
  }
  #sheet::backdrop { background: #000A; }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #sheet { animation: none; } }
  .sheet-in { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet-in h2 {
    margin: 18px 0 8px; font: 500 12px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .14em; color: var(--faded); text-transform: uppercase;
  }
  .sheet-in h2:first-child { margin-top: 4px; }
  .row { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .row .who { flex: 1; font: 500 15px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .04em; }
  .chip {
    min-height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--edge); background: transparent; color: var(--faded);
    font: 500 13px/1 ui-monospace, Menlo, monospace;
  }
  .chip[aria-pressed="true"] { background: #2E2A1F; border-color: #5E5540; color: var(--paper); }
  .chip.wide { flex: 1; text-align: left; padding: 0 14px; min-height: 46px; font-size: 14px; }
  .chip .key { float: right; color: var(--faded); }
  .chip:disabled { opacity: .35; }
  .loop { display: flex; align-items: center; gap: 8px; color: var(--faded); font: 400 14px/1 ui-monospace, Menlo, monospace; padding: 6px 0 2px; }
  .loop input {
    width: 58px; min-height: 40px; text-align: center; border-radius: 10px;
    border: 1px solid var(--edge); background: var(--ink); color: var(--paper);
    font: 500 15px ui-monospace, Menlo, monospace;
  }
  #closeSheet { width: 100%; margin-top: 16px; min-height: 46px; border-radius: 10px; border: 1px solid var(--edge); background: transparent; color: var(--paper); font: 500 14px ui-monospace, Menlo, monospace; }

  /* ---- pasting a script ---- */
  #edit { max-width: 40em; margin: 0 auto; padding: 24px 20px 40px; font: 400 15px/1.55 ui-monospace, Menlo, monospace; color: var(--faded); }
  #edit p { color: var(--cue); }
  textarea {
    width: 100%; height: 58vh; padding: 12px; border-radius: 10px;
    background: #100F0B; color: var(--paper); border: 1px solid var(--edge);
    font: 400 14px/1.5 ui-monospace, Menlo, monospace;
  }
  #start { margin-top: 12px; min-height: var(--tap); padding: 0 20px; border-radius: 10px; border: 1px solid #5E5540; background: #262218; color: var(--paper); font: 500 15px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div id="edit">
  <p>Paste a script — one speech per line, each starting with the character's name and a colon. Your place, your parts and your score are kept in this browser.</p>
  <textarea id="src" spellcheck="false"></textarea>
  <button id="start">Start reading</button>
</div>

<div id="hud" hidden>
  <b id="score"></b>
  <span id="hint"></span>
</div>

<div id="read" hidden></div>

<div id="bar" hidden>
  <button id="backBtn" data-key="arrowup" title="Back (up arrow)" aria-label="Back">&uarr;</button>
  <button id="mainBtn" data-key=" ">Next</button>
  <button id="missBtn" data-key="n" hidden>Missed</button>
  <button id="menuBtn" title="Everything else">More</button>
</div>

<dialog id="sheet">
  <div class="sheet-in">
    <h2>Parts</h2>
    <div id="roles"></div>

    <h2>Aloud</h2>
    <div class="row">
      <button class="chip wide" data-key="p" id="playChip">Read aloud<span class="key">P</span></button>
    </div>
    <label class="loop" title="While reading aloud: play this many sentences, then jump back this many">
      play <input id="chunk" type="number" min="0" max="99" inputmode="numeric"> then go back
      <input id="rewind" type="number" min="0" max="99" inputmode="numeric">
    </label>

    <h2>Practice</h2>
    <div class="row">
      <button class="chip wide" data-key="l" id="learnChip">Learn my lines<span class="key">L</span></button>
    </div>
    <div class="row">
      <button class="chip wide" data-key="w" id="drillBtn">Drill weak lines<span class="key">W</span></button>
    </div>
    <div class="row">
      <button class="chip wide" data-key="k" id="keysChip">Bold the key words<span class="key">K</span></button>
    </div>

    <h2>Script</h2>
    <div class="row">
      <button class="chip wide" data-key="e">Paste a different script<span class="key">E</span></button>
    </div>
    <button id="closeSheet">Close</button>
  </div>
</dialog>
<script src="sentences.js"></script>
<script src="script.js"></script>
<script src="clips.js"></script>
<script>
const $ = id => document.getElementById(id);
const src = $('src'), read = $('read'), edit = $('edit'), hud = $('hud'), roles = $('roles'), score = $('score'), hint = $('hint'), drillBtn = $('drillBtn');
const bar = $('bar'), sheet = $('sheet'), backBtn = $('backBtn'), mainBtn = $('mainBtn'), missBtn = $('missBtn');
let lines = [], i = 0;
// Passive mode: play each line's ElevenLabs clip (made by tts.py) and advance.
const audio = new Audio();
let playing = false, since = 0;
// Learn mode: reveal your lines a sentence at a time and grade yourself on each.
let learn = false, drilling = false;
// Every sentence you have to recall, in script order. Clearing one moves you on;
// missing one takes back the two before it, so the game is how far you can get.
let items = [], cleared = new Set(), shown = false;
const id = it => it.li + ':' + it.si;
const atLine = () => items.filter(it => it.li === i);
const item = () => atLine().find(it => !cleared.has(id(it)));
const load = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
// The parts you are learning. Several at once, and they matter outside learn mode
// too: playback can go silent for them so you say them yourself.
let myRoles = new Set(JSON.parse(load('roles', '[]')));
// Voices switched off for reading aloud, so you speak those parts yourself.
let muted = new Set(JSON.parse(load('muted', '[]')));
// Parts blocked out on the page, so you recite them instead of reading them.
let covered = new Set(JSON.parse(load('covered', '[]')));
const speaker = p => p.textContent.split(':')[0];
const words = p => p.textContent.slice(speaker(p).length + 1);
const cur = () => lines[i];
const has = (p, c) => p.classList.contains(c);
const mine = p => has(p, 'mine');
const bestKey = () => 'best:' + [...myRoles].sort().join('+');

// How often each sentence has been missed, kept across visits so the weak ones can be drilled.
const stats = JSON.parse(load('stats', '{}'));
const key = t => norm(t).slice(0, 60);
const missCount = t => stats[key(t)]?.missed || 0;
const record = (t, ok) => {
  const s = stats[key(t)] ||= { seen: 0, missed: 0 };
  s.seen++;
  s.missed = ok ? Math.max(0, s.missed - 1) : s.missed + 1;  // two clean runs clear one miss
  save('stats', JSON.stringify(stats));
};

const weakLine = p => sentences(words(p)).some(missCount);

// Key words: the rarest words in a sentence, about one in five, bolded as hooks to
// hang the line on. Frequency comes from the script itself, so "years" in a script
// about waiting counts as common.
let keywords = load('keywords') === 'true', freq = {};
const STOP = new Set('a an the and or but so if then than that this these those i you he she it we they me him her them my your his its our their is am are was were be been being do does did done have has had will would can could shall should may might must no not of to in on at for with from by as up out about into over after before there here what which who whom when where why how all any both each few more most other some such own same too very just now oh well yeah yes mr mrs ms dr think thinks know got get gonna going want maybe really thing things way lot said say tell told something someone anything nothing everything im ive ill id youre youve youll thats theres whats hes shes theyre lets dont doesnt didnt cant wont isnt arent wasnt couldnt wouldnt okay ok back'.split(' '));
const keyWords = text => {
  const list = text.match(/[\p{L}\p{N}'-]+/gu) || [];
  const contraction = /^(are|is|was|were|do|does|did|can|could|would|should|have|has|had|wo|ai)nt$/;
  const pick = list.filter(w => norm(w).length > 2 && !STOP.has(norm(w)) && !contraction.test(norm(w)));
  const want = Math.min(4, Math.max(1, Math.ceil(pick.length / 2)));
  // Long and rare beats short and common: a big odd word is the better hook.
  const score = w => (freq[norm(w)] || 0) / 2 - norm(w).length;
  return new Set([...pick].sort((a, b) => score(a) - score(b)).slice(0, want).map(norm));
};
// Text as HTML, with the key words bolded when the mode is on.
const mark = text => {
  if (!keywords) return esc(text);
  const keys = keyWords(text);
  return text.replace(/[\p{L}\p{N}'-]+/gu, w => keys.has(norm(w)) ? `<b>${esc(w)}</b>` : esc(w));
};
const plain = p => {
  // A covered part shows only its speaker until you tap the line to look.
  if (covered.has(speaker(p)) && !p.dataset.open) return p.innerHTML = `${esc(speaker(p))}: <span class="hide">▒▒▒▒▒</span>`;
  const who = speaker(p), said = p.dataset.text.slice(who.length + 1);
  p.innerHTML = `${esc(who)}: ${keywords ? sentences(said).map(mark).join(' ') : esc(said.trim())}`;
};

function show(n) {
  i = (n % lines.length + lines.length) % lines.length;  // past the end is back to the top
  lines.forEach((p, k) => p.classList.toggle('cur', k === i));
  save('line', i);
  if (playing && !moving) { part = 0; play(); }
  if (learn) enter(); else center();
}

// Sound plays a sentence at a time, not a whole speech, so a monologue can be
// looped in pieces. Each clip carries when its sentences start and end.
// A clip is { f: file, s: [[start, end], ...] }; clips.js from before timing was
// added is a bare filename, which still plays as one piece.
const clipOf = p => { const c = window.CLIPS?.[p.dataset.text]; return typeof c === 'string' ? { f: c } : c; };
const spansOf = p => clipOf(p)?.s?.length ? clipOf(p).s : [null];  // null: the whole clip
let part = 0;    // which sentence of the current line is sounding
let moving = false;  // crossing lines: play once at the end, not at every step
let loop = null;     // [first, last] lines to rehearse over and over

// Why the sound is not playing, said in the header rather than the console.
const trouble = why => { hint.textContent = why; console.warn(why); };

function play() {
  if (learn && quizzing()) return;  // your line: grade it first, then carry on
  const clip = clipOf(cur());
  // A silenced voice still plays, silently, so the gap is exactly as long as the line.
  audio.muted = muted.has(speaker(cur()));
  // A line with no clip (a script edited since tts.py last ran) is skipped, not a full stop.
  if (!clip) { trouble(`No clip for line ${i + 1} — rerun tts.py`); return void setTimeout(() => playing && step(1), 600); }
  const span = spansOf(cur())[part = Math.min(part, spansOf(cur()).length - 1)];
  const at = span ? span[0] : 0;
  advanced = false;
  // Seeking before the file has loaded throws, so a new clip is cued once it is ready.
  if (audio.src !== new URL(clip.f, location).href) {
    audio.src = clip.f;
    audio.addEventListener('loadedmetadata', () => { audio.currentTime = at; }, { once: true });
  } else audio.currentTime = at;
  // A play() cut short by the next one rejects; only a browser refusing sound stops us.
  audio.play().catch(e => {
    if (e.name === 'AbortError') return;  // cut short by the next line, which is fine
    trouble(`Sound blocked: ${e.name}. Press Play again.`);
    stopPlay();
  });
  // Nothing playing and nothing moving: say so rather than sit there clicking.
  clearTimeout(stuck);
  stuck = setTimeout(() => {
    if (playing && audio.paused) trouble(`Stuck on line ${i + 1}: ${audio.src.split('/').pop()} will not play (state ${audio.readyState})`);
  }, 2000);
}
function stopPlay() { playing = false; audio.pause(); }

// A short falling blip when playback jumps backwards, so a loop is audible.
let tones;
function blip() {
  tones ||= new (window.AudioContext || window.webkitAudioContext)();
  const osc = tones.createOscillator(), gain = tones.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, tones.currentTime);
  osc.frequency.exponentialRampToValueAtTime(440, tones.currentTime + 0.12);
  gain.gain.setValueAtTime(0.14, tones.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, tones.currentTime + 0.16);
  osc.connect(gain).connect(tones.destination);
  osc.start();
  osc.stop(tones.currentTime + 0.17);
}
audio.onerror = () => playing && trouble(`Cannot load ${audio.src.split('/').pop()} (error ${audio.error?.code})`);

// A sentence ends before the clip does, so playback is stopped at its end time.
// Both this and the clip's own end can fire, hence the latch: one move per piece.
let advanced = false, stuck = 0;
audio.ontimeupdate = () => {
  const span = spansOf(cur())[part];
  if (playing && span && !advanced && audio.currentTime >= span[1]) { advanced = true; audio.pause(); advance(); }
};

// Move n sentences through the script, crossing into other lines as needed.
// A jump backwards is marked by a blip in the clear, then a beat, then the lines.
function step(n, rewound) {
  moving = true;
  let back = rewound || n < 0;
  while (n > 0) {
    if (part + 1 < spansOf(cur()).length) part++;
    else if (loop && i >= loop[1]) { part = 0; show(loop[0]); back = true; }  // round the block again
    else { part = 0; show(i + 1); }
    n--;
  }
  while (n < 0) {
    if (part > 0) part--;
    else { show(loop && i <= loop[0] ? loop[1] : i - 1); part = spansOf(cur()).length - 1; }
    n++;
  }
  moving = false;
  if (!playing) return;
  if (!back) return play();
  audio.pause();
  blip();
  setTimeout(() => playing && play(), 600);
}
// Drilling by ear: read a few lines, drop back a few, and creep forward over the script.
audio.onended = () => { if (!advanced) { advanced = true; advance(); } };
const advance = () => setTimeout(() => {
  if (!playing) return;
  const chunk = +$('chunk').value, rewind = +$('rewind').value;
  since++;
  // Going back even to the same line is a rewind: it earns the blip and a beat.
  if (chunk && since >= chunk) { since = 0; step(1 - rewind, rewind > 0); }
  else step(1);
}, 300);
for (const id of ['chunk', 'rewind']) {
  $(id).value = load(id, id === 'chunk' ? 0 : 0);
  $(id).onchange = () => { save(id, $(id).value); since = 0; $(id).blur(); };
}

const quizzing = () => learn && !!item();

// Start (or leave) the current line: your lines get hidden a sentence at a time.
function enter() {
  lines.forEach(p => { if (p !== cur()) plain(p); });
  shown = false;
  paint(); render();
}

// Redraw the current line: cleared sentences plain, the one under test revealed or blurred.
function paint() {
  const p = cur(), mine = atLine();
  if (!mine.length) { plain(p); return center(); }
  const now = item();
  let rest = p.dataset.text.slice(speaker(p).length + 1), html = speaker(p) + ':';  // the original text, not what is on screen
  for (const it of mine) {
    const at = rest.indexOf(it.text);
    html += esc(rest.slice(0, at));
    const done = cleared.has(id(it)) || (it === now && shown);
    // One fixed row of blocks for the sentence under test, and nothing past it: a
    // sentence's length, and how many are still to come, give too much away.
    // A sentence you keep missing is marked on its own, not across the whole line.
    // The weak mark is a warning on what is still coming, never on one you just cleared.
    const cls = done ? (it === now && shown ? 'now' : '') : 'hide' + (missCount(it.text) ? ' weak' : '');
    html += `<span class="${cls}">${done ? mark(it.text) : '▒▒▒▒▒'}</span>`;
    if (!done) { p.innerHTML = html; return center(); }
    rest = rest.slice(at + it.text.length);
  }
  p.innerHTML = html + esc(rest);
  center();
}

// Keep the sentence under test in the middle of the screen. Revealing text changes
// the line's height, so this runs on every repaint, not just when the line changes.
function center() {
  (cur()?.querySelector('.now, .hide') || cur())?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

function grade(ok) {
  const now = item(), n = items.indexOf(now);
  record(now.text, ok);
  shown = false;
  if (ok) {
    cleared.add(id(now));
    if (cleared.size > +load(bestKey(), 0)) save(bestKey(), cleared.size);
  } else {
    // A miss costs the two sentences before it, which you have to get again.
    for (const back of items.slice(Math.max(0, n - 2), n)) cleared.delete(id(back));
  }
  const back = items[Math.max(0, n - 2)];
  if (!ok && back !== now) return show(back.li);
  if (item()) { paint(); render(); }
  else { paint(); next(); }
}

// Back one sentence: take back the last one you cleared and say it again.
function back() {
  const now = item();
  const n = now ? items.indexOf(now) : items.findLastIndex(it => it.li <= i && cleared.has(id(it))) + 1;
  const prev = items[n - 1];
  if (!prev) return show(i - 1);  // nothing of yours behind you: step back a line
  cleared.delete(id(prev));
  shown = false;
  prev.li === i ? (paint(), render()) : show(prev.li);
}

// Next line; while drilling weak lines, skip ahead to the next one that needs work.
function next() {
  if (!drilling) return show(i + 1);
  const weak = (from, to) => lines.findIndex((p, k) => k > from && k < to && mine(p) && weakLine(p));
  const t = weak(i, lines.length);
  show(t < 0 ? weak(-1, i + 1) : t);  // round again from the top when none are left ahead
}

function render() {
  const weak = lines.filter(p => mine(p) && weakLine(p)).length;
  const on = (el, yes) => el.setAttribute('aria-pressed', yes ? 'true' : 'false');

  // The bar: back, the one thing to press, and a miss when there is one to record.
  mainBtn.textContent = quizzing() ? (shown ? 'Got it' : 'Reveal') : 'Next';
  missBtn.hidden = !(quizzing() && shown);
  backBtn.innerHTML = '&uarr;';
  hud.hidden = !(learn || loop || playing);

  score.textContent = learn ? `${cleared.size} of ${items.length} clear · best ${load(bestKey(), 0)}` : '';
  hint.textContent = playing && muted.has(speaker(cur())) ? `${speaker(cur())} is silenced`
    : loop && !learn ? `Looping ${loop[1] - loop[0] + 1} lines — Esc to stop`
    : !learn ? (playing ? 'Reading aloud' : '')
    : quizzing() ? (shown ? 'Right, or say you missed it' : `Say it, then reveal${atLine().length > 1 ? ` (${atLine().indexOf(item()) + 1} of ${atLine().length})` : ''}`)
    : drilling && !weak ? 'Weak lines cleared' : 'Keep going';

  for (const chip of roles.querySelectorAll('.chip')) {
    const name = chip.dataset.role;
    on(chip, chip.dataset.state === 'Mine' ? myRoles.has(name)
      : chip.dataset.state === 'Show' ? !covered.has(name) : !muted.has(name));
  }
  $('playChip').firstChild.textContent = playing ? 'Stop reading aloud' : 'Read aloud';
  $('learnChip').firstChild.textContent = learn ? 'Stop learning' : 'Learn my lines';
  $('keysChip').firstChild.textContent = keywords ? 'Hide the key words' : 'Bold the key words';
  drillBtn.firstChild.textContent = weak ? `Drill ${weak} weak line${weak > 1 ? 's' : ''}` : 'No weak lines yet';
  drillBtn.disabled = !weak;
  on($('playChip'), playing); on($('learnChip'), learn); on($('keysChip'), keywords);
}

function startLearn(weakOnly) {
  learn = true; drilling = !!weakOnly;
  hud.hidden = false; document.body.classList.add('learn');
  lines.forEach(p => {
    p.classList.toggle('mine', !myRoles.size || myRoles.has(speaker(p)));
  });
  cleared = new Set();
  items = lines.flatMap((p, li) => mine(p)
    ? sentences(words(p)).map((text, si) => ({ li, si, text })).filter(it => !drilling || missCount(it.text))
    : []);
  if (drilling) { const t = lines.findIndex(p => mine(p) && weakLine(p)); show(t < 0 ? i : t); }
  else enter();
}

function stopLearn() {
  learn = drilling = false; items = []; cleared = new Set(); document.body.classList.remove('learn');
  lines.forEach(p => { plain(p); p.classList.toggle('mine', !myRoles.size || myRoles.has(speaker(p))); });
}

// A checkbox per character for the parts you are learning, and a speaker beside
// each one to silence that voice while the script is read aloud.
// One row per character: whether you are learning it, whether you can see it,
// and whether you hear it. Named in words, since an icon here is a guess.
function buildRoles(names) {
  const toggle = (name, label, title, flip) => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = label;
    chip.title = title;
    chip.dataset.role = name;
    chip.dataset.state = label;
    chip.onclick = () => { flip(); chip.blur(); render(); };
    return chip;
  };
  roles.replaceChildren(...names.map(n => {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.name = n;
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = n;
    row.append(who,
      toggle(n, 'Mine', `Learn ${n}'s lines`, () => {
        myRoles.has(n) ? myRoles.delete(n) : myRoles.add(n);
        save('roles', JSON.stringify([...myRoles]));
        learn ? startLearn(drilling) : stopLearn();
      }),
      toggle(n, 'Show', `Show ${n}'s lines`, () => {
        covered.has(n) ? covered.delete(n) : covered.add(n);
        save('covered', JSON.stringify([...covered]));
        lines.forEach(p => { delete p.dataset.open; if (!learn || p !== cur()) plain(p); });
      }),
      toggle(n, 'Hear', `Play ${n}'s voice`, () => {
        muted.has(n) ? muted.delete(n) : muted.add(n);
        save('muted', JSON.stringify([...muted]));
      }));
    return row;
  }));
}

$('start').onclick = () => {
  const sameScript = load('script') === src.value;  // a new script starts from the top
  save('script', src.value);
  save('pasted', src.value !== (window.SCRIPT || ''));  // a pasted script wins over the bundled one
  // "***" marks a scene break: a divider you pass over, not a line you step on.
  read.replaceChildren(...src.value.split('\n').filter(l => l.trim()).map(t => {
    if (t.trim() === '***') return document.createElement('hr');
    const p = document.createElement('p');
    p.dataset.text = t;
    p.textContent = t;
    p.onclick = () => {
      if (covered.has(speaker(p)) && !p.dataset.open) { p.dataset.open = '1'; return plain(p); }
      show(lines.indexOf(p));
    };
    return p;
  }));
  lines = [...read.querySelectorAll('p')];
  if (!lines.length) return;
  freq = {};
  for (const w of src.value.match(/[\p{L}\p{N}'-]+/gu) || []) freq[norm(w)] = (freq[norm(w)] || 0) + 1;
  lines.forEach(plain);
  buildRoles([...new Set(lines.map(speaker))]);
  stopLearn();
  edit.hidden = true; read.hidden = bar.hidden = false;
  show(sameScript ? +load('line', 0) : 0);
  render();
};

src.value = (load('pasted') === 'true' ? load('script') : window.SCRIPT) || load('script') || '';
if (src.value.trim()) $('start').click();

// One handler for keyboard shortcuts and the phone button bar. Returns false for unused keys.
function act(k) {
  if (quizzing() && !shown && (k === ' ' || k === 'arrowdown')) { shown = true; paint(); render(); }
  else if (quizzing() && shown && (k === ' ' || k === 'y' || k === 'arrowright')) {
    const line = i;
    grade(true);
    // One press per sentence: it marks the sentence you just read as right and
    // reveals the next one, which you have already said.
    if (quizzing() && i === line) { shown = true; paint(); render(); }
  }
  else if (quizzing() && shown && k === 'n') grade(false);
  else if (k === ' ' || k === 'arrowdown') next();
  else if (k === 'arrowup' || k === 'backspace') learn ? back() : show(i - 1);
  else if (k === 'e') { hud.hidden = bar.hidden = true; stopPlay(); stopLearn(); read.hidden = true; edit.hidden = false; }
  else if (k === 'escape' && loop) { loop = null; markLoop(null); }
  else if (k === 'p') { since = 0; part = 0; (playing = !playing) ? play() : stopPlay(); }
  else if (k === 'l') learn ? stopLearn() : startLearn();
  else if (k === 'k') { keywords = !keywords; save('keywords', keywords); lines.forEach(p => p !== cur() && plain(p)); learn ? paint() : plain(cur()); }
  else if (k === 'w') learn && drilling ? startLearn() : startLearn(true);
  else return false;
  render();  // the phone's buttons change with the mode, so redraw them after every action
  return true;
}

document.addEventListener('keydown', e => {
  // A number box keeps the keys while you type in it, but only the digits.
  if (sheet.open && e.key !== 'Escape') return;  // the sheet has its own buttons
  if (e.target.tagName === 'INPUT' && /^[0-9]$/.test(e.key)) return;
  if (e.target.tagName === 'INPUT') e.target.blur();
  if (read.hidden) return;
  const k = e.key.toLowerCase();
  // Space and the arrows always stop here, even when unused, so the page never scrolls
  // or hands the key to the browser.
  if (act(k) | (k === ' ' || k.startsWith('arrow'))) e.preventDefault();
});
// Drag across lines to rehearse that block: it plays them over and over.
let dragFrom = null;
const lineAt = e => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const p = el?.closest?.('#read p');
  return p ? lines.indexOf(p) : null;
};
function markLoop(a, b) {
  lines.forEach((p, k) => p.classList.toggle('looped', a !== null && k >= Math.min(a, b) && k <= Math.max(a, b)));
}
read.addEventListener('pointerdown', e => { dragFrom = lineAt(e); });
read.addEventListener('pointermove', e => {
  if (dragFrom === null) return;
  const to = lineAt(e);
  if (to !== null && to !== dragFrom) { markLoop(dragFrom, to); e.preventDefault(); }
});
read.addEventListener('pointerup', e => {
  const from = dragFrom, to = lineAt(e);
  dragFrom = null;
  if (from === null || to === null || to === from) return;  // a tap is still a tap
  loop = [Math.min(from, to), Math.max(from, to)];
  markLoop(...loop);
  show(loop[0]); part = 0;
  if (!playing) { playing = true; play(); }
  render();
});

// Install the worker that keeps the script and every clip on the device.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('No offline cache:', e));
}

document.querySelectorAll('[data-key]').forEach(b => {
  b.tabIndex = -1;  // taps must not leave focus on a button, where Space would press it again
  b.onclick = () => { b.blur(); act(b.dataset.key); };
});
$('menuBtn').onclick = () => { $('menuBtn').blur(); render(); sheet.showModal(); };
$('closeSheet').onclick = () => sheet.close();
sheet.onclick = e => { if (e.target === sheet) sheet.close(); };  // tap the dark to dismiss
</script>
</body>
</html>
