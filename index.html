<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Follower</title>
<style>
  :root { --bg: #111; --fg: #eee; --dim: #555; --hi: #ffd84d; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 32px/1.5 Georgia, serif; }
  #edit { max-width: 800px; margin: 40px auto; padding: 0 16px; font-size: 16px; }
  textarea { width: 100%; height: 60vh; font: 16px/1.4 monospace; background: #222; color: var(--fg); border: 1px solid #444; padding: 8px; box-sizing: border-box; }
  button { font-size: 16px; padding: 8px 16px; margin-top: 8px; }
  #read { max-width: 900px; margin: 0 auto; padding: 50vh 16px; }
  #read p { margin: 0 0 .6em; color: var(--dim); transition: color .2s; cursor: pointer; }
  #read p.cur { color: var(--hi); }
  #read p.cur ~ p { color: var(--fg); }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 8px 16px; background: #000c; font: 16px/1.4 system-ui, sans-serif; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  #hud select, #hud button { font-size: 16px; margin: 0; padding: 4px 12px; }
  #answer { display: block; width: 100%; box-sizing: border-box; margin: 0 0 .6em; font: inherit; background: #222; color: var(--fg); border: 1px solid var(--hi); padding: 4px 8px; }
  #hint { color: #999; }
  body.learn #read p.mine:not(.got):not(.missed) { filter: blur(10px); }
  #read p.got { box-shadow: -8px 0 0 #3c6; }
  #read p.missed { box-shadow: -8px 0 0 #e44; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="edit">
  <p>Paste script. One line per step. Then Start. Keys: Space/↓ next, ↑/Backspace back, Esc edit, L learn mode. Click a line to jump.</p>
  <textarea id="src"></textarea>
  <button id="start">Start</button>
</div>
<div id="hud" hidden>
  <label>Your role <select id="role"></select></label>
  <b id="score"></b>
  <span id="hint"></span>
</div>
<div id="read" hidden></div>
<script src="script.js"></script>
<script>
const $ = id => document.getElementById(id);
const src = $('src'), read = $('read'), edit = $('edit'), hud = $('hud'), role = $('role'), score = $('score'), hint = $('hint');
const answer = Object.assign(document.createElement('input'), { id: 'answer', placeholder: 'Type your line, Enter to check' });
let lines = [], i = 0;
// Learn mode: your role's lines are blurred; type each one from memory to score it.
let learn = false, drill = null, got = 0, tried = 0, streak = 0;
const load = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const speaker = p => p.textContent.split(':')[0];
const words = p => p.textContent.slice(speaker(p).length + 1);
// Only letters and digits count: case, spaces and punctuation are ignored.
const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
const cur = () => lines[i];
const has = (p, c) => p.classList.contains(c);
const pending = p => has(p, 'mine') && !has(p, 'got') && !has(p, 'missed');
const bestKey = () => 'best:' + role.value;

try { src.value = load('script') || window.SCRIPT || ''; } catch {}

function show(n) {
  i = Math.max(0, Math.min(lines.length - 1, n));
  lines.forEach((p, k) => p.classList.toggle('cur', k === i));
  lines[i]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (!learn) return;
  if (pending(cur())) { answer.value = ''; cur().after(answer); answer.focus({ preventScroll: true }); }
  else answer.remove();
  render();
}

function render() {
  score.textContent = `${got}/${tried} · streak ${streak} · best ${load(bestKey(), 0)}` + (drill ? ' · drilling missed' : '');
  const missed = lines.filter(p => has(p, 'missed')).length;
  if (pending(cur())) hint.textContent = 'Enter to check · Esc to leave the box';
  else if (has(cur(), 'missed')) hint.textContent = 'Missed. Space to continue';
  else if (lines.some(pending)) hint.textContent = 'Space next · L exit';
  else hint.textContent = missed ? `Done: ${got}/${tried}. R to drill ${missed} missed` : `Perfect ${got}/${tried}! R to go again`;
}

function startLearn(only) {
  learn = true; got = tried = streak = 0;
  drill = only?.length ? only : null;
  document.body.classList.add('learn'); hud.hidden = false;
  lines.forEach(p => {
    p.classList.toggle('mine', (!role.value || speaker(p) === role.value) && (!drill || drill.includes(p)));
    p.classList.remove('got', 'missed');
  });
  save('role', role.value);
  drill ? step(-1) : show(0);
}

function stopLearn() {
  learn = false; drill = null;
  document.body.classList.remove('learn'); hud.hidden = true; answer.remove();
  lines.forEach(p => p.classList.remove('mine', 'got', 'missed'));
}

// Next line; while drilling, jump to the cue line before the next missed line.
function step(from) {
  if (!drill) return show(from + 1);
  const t = lines.findIndex((p, k) => k > from && pending(p));
  show(t < 0 ? lines.length - 1 : from < t - 1 ? t - 1 : t);
}

answer.addEventListener('keydown', e => {
  if (e.key === 'Escape') answer.blur();
  if (e.key !== 'Enter') return;
  const ok = norm(answer.value) === norm(words(cur()));
  cur().classList.add(ok ? 'got' : 'missed');
  tried++;
  if (ok) { got++; streak++; if (streak > +load(bestKey(), 0)) save(bestKey(), streak); step(i); }
  else { streak = 0; answer.remove(); render(); }
});

role.onchange = () => { role.blur(); startLearn(); };

$('start').onclick = () => {
  save('script', src.value);
  read.replaceChildren(...src.value.split('\n').filter(l => l.trim()).map((t, k) => {
    const p = document.createElement('p');
    p.textContent = t;
    p.onclick = () => show(k);
    return p;
  }));
  lines = [...read.children];
  if (!lines.length) return;
  const names = [...new Set(lines.map(speaker))];
  role.replaceChildren(new Option('Everyone (all lines)', ''), ...names.map(n => new Option(n)));
  role.value = names.includes(load('role')) ? load('role') : '';
  stopLearn();
  edit.hidden = true; read.hidden = false;
  show(0);
};

if (src.value.trim()) $('start').click();

document.addEventListener('keydown', e => {
  if (read.hidden || e.target === answer || e.target === role) return;
  const k = e.key.toLowerCase();
  if ((k === ' ' || k === 'arrowdown') && learn && pending(cur())) answer.focus();
  else if (k === ' ' || k === 'arrowdown') step(i);
  else if (k === 'arrowup' || k === 'backspace') show(i - 1);
  else if (k === 'escape') { stopLearn(); read.hidden = true; edit.hidden = false; }
  else if (k === 'l') learn ? stopLearn() : startLearn();
  else if (k === 'r' && learn && !lines.some(pending)) startLearn(lines.filter(p => has(p, 'missed')));
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
