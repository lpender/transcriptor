name = "tablework-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tablework"
database_id = "local"          # ACTION for Lee: replace after `wrangler d1 create tablework`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "tablework-clips"   # ACTION for Lee: `wrangler r2 bucket create tablework-clips`

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "local"   # ACTION for Lee: `wrangler kv namespace create OAUTH_KV`

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
APP_ORIGIN = "http://localhost:8799"
API_ORIGIN = "http://localhost:8787"
SEALING_KEY = "local-dev-only-not-a-secret"   # prod: `wrangler secret put SEALING_KEY` (Lee)
# RESEND_API_KEY and MAIL_FROM are secrets: `wrangler secret put` (Lee). Unset = links are logged.

# Live. Deployed by Lee: `task deploy` (wrangler deploy --env production).
# Secrets are set once with `wrangler secret put <NAME> --env production`.
[env.production]
name = "tablework-api"
routes = [{ pattern = "api.tablework.com", custom_domain = true }]
vars = { APP_ORIGIN = "https://tablework.com", API_ORIGIN = "https://api.tablework.com" }
d1_databases = [{ binding = "DB", database_name = "tablework", database_id = "local", migrations_dir = "migrations" }]   # ACTION: paste the id from `wrangler d1 create tablework`
r2_buckets = [{ binding = "CLIPS", bucket_name = "tablework-clips" }]
kv_namespaces = [{ binding = "OAUTH_KV", id = "local" }]   # ACTION: paste the id from `wrangler kv namespace create OAUTH_KV`
durable_objects = { bindings = [{ name = "ROOMS", class_name = "Room" }] }
